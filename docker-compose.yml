services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vipcar
      POSTGRES_PASSWORD: vipcar
      POSTGRES_DB: vipcar
    ports:
      - "5432:5432"
    volumes:
      - vipcar_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vipcar -d vipcar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=identity
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-replace-with-long-random-string}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      IDENTITY_HTTP_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  catalog:
    build:
      context: .
      dockerfile: apps/catalog/Dockerfile
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=catalog
      NATS_URL: nats://nats:4222
      CATALOG_HTTP_PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=cms
      NATS_URL: nats://nats:4222
      CMS_HTTP_PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  booking:
    build:
      context: .
      dockerfile: apps/booking/Dockerfile
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=booking
      NATS_URL: nats://nats:4222
      BOOKING_HTTP_PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  notify:
    build:
      context: .
      dockerfile: apps/notify/Dockerfile
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=notify
      NATS_URL: nats://nats:4222
      NOTIFY_HTTP_PORT: 3005
      OPS_WHATSAPP_TO: ${OPS_WHATSAPP_TO:-21655771077}
      OPS_EMAIL_TO: ${OPS_EMAIL_TO:-info@vipcar.com.tn}
      NOTIFY_CHANNELS: ${NOTIFY_CHANNELS:-whatsapp,email}
      NOTIFY_MOCK_FAIL: ${NOTIFY_MOCK_FAIL:-}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  fleet:
    build:
      context: .
      dockerfile: apps/fleet/Dockerfile
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=fleet
      NATS_URL: nats://nats:4222
      FLEET_HTTP_PORT: 3006
      REDIS_URL: redis://redis:6379
      FLEET_HOLD_TTL_SECONDS: ${FLEET_HOLD_TTL_SECONDS:-600}
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3006/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  billing:
    build:
      context: .
      dockerfile: apps/billing/Dockerfile
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=billing
      NATS_URL: nats://nats:4222
      BILLING_HTTP_PORT: 3007
      BILLING_DEFAULT_PROVIDER: ${BILLING_DEFAULT_PROVIDER:-manual}
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3007/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  dispatch:
    build:
      context: .
      dockerfile: apps/dispatch/Dockerfile
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=dispatch
      NATS_URL: nats://nats:4222
      DISPATCH_HTTP_PORT: 3008
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3008/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-replace-with-long-random-string}
      GATEWAY_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      cms:
        condition: service_healthy
      booking:
        condition: service_healthy
      billing:
        condition: service_healthy
      dispatch:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  vipcar_pg:

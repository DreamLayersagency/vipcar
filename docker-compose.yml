services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vipcar
      POSTGRES_PASSWORD: vipcar
      POSTGRES_DB: vipcar
    ports:
      - "5432:5432"
    volumes:
      - vipcar_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vipcar -d vipcar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile
    environment:
      DATABASE_URL: postgresql://vipcar:vipcar@postgres:5432/vipcar?schema=identity
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-replace-with-long-random-string}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      IDENTITY_HTTP_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET:-replace-with-long-random-string}
      GATEWAY_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      identity:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  vipcar_pg:
